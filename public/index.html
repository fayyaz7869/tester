<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff & Dev Testing Points Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Simple Light Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-wrap">
        <div class="brand-icon">✓</div>
        <div>
          <h1 class="brand-title">Testing Point Hub</h1>
          <div class="brand-sub">Staff &amp; Developer Team System</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div id="storageBadge" class="storage-badge">
          <span class="dot"></span>
          <span id="storageBadgeText">Storage Ready</span>
        </div>
        <button id="resetDemoBtn" style="background: none; border: 1px solid #e2e8f0; color: #64748b; padding: 0.35rem 0.7rem; border-radius: 6px; font-size: 0.78rem; cursor: pointer;">
          Reset Demo
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Top Card: Add Testing Point (Simple, Clean, Large Text + Image) -->
    <section class="add-point-card">
      <div class="add-card-header">
        <div class="add-card-title">
          <span>📝 Naya Testing Point Daalein</span>
        </div>
      </div>

      <textarea id="inputPointText" class="point-textarea" placeholder="Yahan testing point likhein... (Bada text, steps to reproduce, actual vs expected sab allowed hai)"></textarea>

      <div class="add-card-bottom">
        <div class="add-inputs-group">
          <!-- Staff Name -->
          <input type="text" id="inputAuthor" class="name-input" placeholder="Aapka Naam (e.g. Rahul/Pooja)">

          <!-- Image Attachment -->
          <label for="inputPointImage" class="attach-btn-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            Attach Screenshot / Image
          </label>
          <input type="file" id="inputPointImage" accept="image/*" style="display: none;">

          <!-- Selected Image Preview Bar -->
          <div id="imagePreviewBar" class="image-preview-bar" style="display: none;">
            <img id="imagePreviewThumb" class="image-preview-thumb" src="" alt="preview">
            <span id="imagePreviewName">image.png</span>
            <span id="removeImageBtn" class="remove-thumb-btn">&times;</span>
          </div>
        </div>

        <button id="submitPointBtn" class="btn-primary">
          <span>+ Testing Point Add Karein</span>
        </button>
      </div>
    </section>

    <!-- Tabs Navigation Bar (Pending -> In Process -> Checked/Done) -->
    <section>
      <div class="search-strip" style="margin-bottom: 0.75rem;">
        <nav class="tabs-container" id="statusTabs">
          <button class="tab-button active" data-tab="pending">
            <span>⏳ Pending Points</span>
            <span class="tab-badge" id="badgePending">0</span>
          </button>
          <button class="tab-button" data-tab="process">
            <span>⚡ In Process</span>
            <span class="tab-badge" id="badgeProcess">0</span>
          </button>
          <button class="tab-button" data-tab="done">
            <span>✅ Checked / Done</span>
            <span class="tab-badge" id="badgeDone">0</span>
          </button>
          <button class="tab-button" data-tab="all">
            <span>📋 All Points</span>
            <span class="tab-badge" id="badgeAll">0</span>
          </button>
        </nav>

        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search testing points...">
        </div>
      </div>
    </section>

    <!-- Testing Points List Container -->
    <section id="pointsList" class="points-list">
      <!-- Dynamic Testing Point Cards Injected Here -->
    </section>

  </main>

  <!-- Lightbox Modal (For full screen image zoom) -->
  <div id="lightbox" class="lightbox">
    <button id="lightboxClose" class="lightbox-close">&times;</button>
    <img id="lightboxImg" src="" alt="Full view screenshot">
  </div>

  <!-- Toast Container -->
  <div id="toastBox" class="toast-box"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
